<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="COMMUNICATIONS.MATRIX">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".75"/><stop offset=".5" stop-color="#30363d" stop-opacity=".6"/><stop offset="1" stop-color="#3fb950" stop-opacity=".55"/></linearGradient>
    <radialGradient id="glowA" cx="20%" cy="10%" r="45%"><stop offset="0" stop-color="#1f6feb" stop-opacity=".28"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="85%" cy="90%" r="45%"><stop offset="0" stop-color="#8957e5" stop-opacity=".2"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".9"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="898" height="158" rx="18"/></clipPath>
  </defs>
  <style>
    .fade{opacity:0;animation:fade .7s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .sweep{animation:sweep 4s linear infinite}
    @keyframes sweep{from{transform:translateX(-900px)}to{transform:translateX(900px)}}
    .glow{animation:glow 6s ease-in-out infinite alternate}
    @keyframes glow{from{opacity:.55}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="160" fill="#0d1117"/>
    <rect class="glow" width="900" height="160" fill="url(#glowA)"/>
    <rect class="glow" style="animation-delay:-3s" width="900" height="160" fill="url(#glowB)"/>
    <rect class="sweep" x="0" y="62" width="900" height="1.5" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="898" height="158" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <circle class="pulse" cx="34" cy="36" r="4" fill="#3fb950"/>
  <text x="48" y="41" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="2.5" fill="#58a6ff">COMMUNICATIONS.MATRIX</text>
  <text x="286.5" y="41" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8b949e">./connect --mesh</text>
  <text x="870" y="41" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="end">ACTIVE CHANNELS</text>
  <line x1="28" y1="62" x2="872" y2="62" stroke="#30363d"/>
  
  <g class="fade" style="animation-delay:0.1s">
    <rect x="28" y="82" width="410" height="56" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="56" cy="110" r="14" fill="#21262d"/>
    <text x="56" y="115" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">⌥</text>
    <text x="82" y="101" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#8b949e">GITHUB PROFILE</text>
    <text x="82" y="123" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#58a6ff">@ZETIC7Z</text>

    <rect x="462" y="82" width="410" height="56" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="490" cy="110" r="14" fill="#21262d"/>
    <text x="490" y="115" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f5b800" text-anchor="middle">⚡</text>
    <text x="516" y="101" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#8b949e">PORTFOLIO &amp; SHOWCASE</text>
    <text x="516" y="123" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#f5b800">www.zeticuz.xyz</text>
  </g>
</svg>