<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-label="OPERATOR.PROFILE">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".75"/><stop offset=".5" stop-color="#30363d" stop-opacity=".6"/><stop offset="1" stop-color="#3fb950" stop-opacity=".55"/></linearGradient>
    <radialGradient id="glowA" cx="20%" cy="10%" r="45%"><stop offset="0" stop-color="#1f6feb" stop-opacity=".28"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="85%" cy="90%" r="45%"><stop offset="0" stop-color="#8957e5" stop-opacity=".2"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".9"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="898" height="158" rx="18"/></clipPath>
  </defs>
  <style>
    .fade{opacity:0;animation:fade .7s ease-out forwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .sweep{animation:sweep 4s linear infinite}
    @keyframes sweep{from{transform:translateX(-900px)}to{transform:translateX(900px)}}
    .glow{animation:glow 6s ease-in-out infinite alternate}
    @keyframes glow{from{opacity:.55}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="160" fill="#0d1117"/>
    <rect class="glow" width="900" height="160" fill="url(#glowA)"/>
    <rect class="glow" style="animation-delay:-3s" width="900" height="160" fill="url(#glowB)"/>
    <rect class="sweep" x="0" y="62" width="900" height="1.5" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="898" height="158" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <circle class="pulse" cx="34" cy="36" r="4" fill="#3fb950"/>
  <text x="48" y="41" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="2.5" fill="#58a6ff">OPERATOR.PROFILE</text>
  <text x="234" y="41" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8b949e">./whoami --extended</text>
  <text x="870" y="41" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="end">PHILIPPINES (PH)</text>
  <line x1="28" y1="62" x2="872" y2="62" stroke="#30363d"/>
  
  <g class="fade" style="animation-delay:0.1s">
    <text x="32" y="104" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">AI-First Full-Stack Engineer · React, TypeScript, Node.js &amp; Streaming Architectures</text>
    <rect x="32" y="120" width="176" height="24" rx="12" fill="#1f6feb" fill-opacity=".15" stroke="#58a6ff" stroke-width="1"/>
    <text x="44" y="136" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#58a6ff">&gt; open to collaboration</text>
    <rect x="220" y="120" width="168" height="24" rx="12" fill="#238636" fill-opacity=".15" stroke="#3fb950" stroke-width="1"/>
    <text x="232" y="136" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#3fb950">✓ production verified</text>
  </g>
</svg>