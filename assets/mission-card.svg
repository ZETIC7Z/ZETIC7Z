<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 185" width="100%" height="185" fill="none">
  <defs>
    <linearGradient id="missionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="missionBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="40%" stop-color="rgba(0, 240, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(245, 184, 0, 0.15)" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "JetBrains Mono", monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; letter-spacing: 2px; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: #FFFFFF; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; fill: #9BA3AF; }
    .status { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11.5px; font-weight: 600; fill: #F5B800; }
  </style>

  <!-- Card Body -->
  <rect x="1" y="1" width="878" height="183" rx="18" fill="url(#missionBg)" stroke="url(#missionBorder)" stroke-width="1.5" />

  <!-- Eyebrow -->
  <circle cx="28" cy="28" r="4" fill="#00F0FF" filter="url(#cyanGlow)" />
  <text x="40" y="32" class="eyebrow">CURRENT MISSION OBJECTIVE</text>

  <!-- Title -->
  <text x="28" y="66" class="heading">High-Fidelity Web Engines, Streaming PWAs &amp; Autonomous Agent Systems</text>

  <!-- Description -->
  <text x="28" y="96" class="body">Solo engineer with 5+ years shipping production-grade platforms. Specializing in high-performance streaming</text>
  <text x="28" y="118" class="body">video infrastructures (HLS/M3U8), zero-code-drift AST compiler pipelines (Zetcage), and cinematic 3D web experiences.</text>

  <!-- Status Bar -->
  <g transform="translate(28, 142)">
    <rect width="824" height="28" rx="6" fill="#070A0F" stroke="rgba(255,255,255,0.05)" />
    <text x="14" y="18" class="status">› STATUS: OPEN TO COLLABORATION &amp; CONTRACTS</text>
    <text x="500" y="18" class="status" fill="#00F0FF" style="fill: #00F0FF;">› LOC: PHILIPPINES [UTC+8]</text>
    <text x="790" y="18" text-anchor="end" class="status" fill="#10B981" style="fill: #10B981;">› LEVEL: 100 RP</text>
  </g>
</svg>
